services:
  - type: web
    name: portafolio-escolar-kensy
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm run db:init && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: portafolio-escolar-db
          property: connectionString
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

databases:
  - name: portafolio-escolar-db
    plan: free
    region: oregon
    databaseName: portafolio
    user: portfolio_app
    postgresMajorVersion: "17"
